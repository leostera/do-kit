<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="566" viewBox="0 0 1200 566">
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#101828}.title{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#475467}.label{font-size:15px;font-weight:600;fill:#344054}.legend{font-size:15px}.value{font-size:14px;font-weight:600;fill:#344054}.na{font-size:13px;fill:#98a2b3}.note{font-size:13px;fill:#667085}.axisline{stroke:#344054}</style>
<rect width="1200" height="566" fill="#fff"/>
<text x="96" y="40" class="title">Write latency p95 during a split</text><text x="96" y="66" class="sub">From 1 s before the split until 1 s after it settles, background cleanup included. Each panel has its own scale.</text>
<line x1="96" x2="335" y1="400" y2="400" class="axisline"/><rect x="114.0" y="216.9" width="59.7" height="183.1" rx="3" fill="#e4572e"/><text x="143.83333333333334" y="208.94915254237287" text-anchor="middle" class="value">18 ms</text><rect x="185.7" y="237.3" width="59.7" height="162.7" rx="3" fill="#7a5af8"/><text x="215.50000000000003" y="229.28813559322035" text-anchor="middle" class="value">16 ms</text><rect x="257.3" y="145.8" width="59.7" height="254.2" rx="3" fill="#2e86ab"/><text x="287.1666666666667" y="137.76271186440678" text-anchor="middle" class="value">25 ms</text><text x="215.5" y="430" text-anchor="middle" class="label">1 MiB</text><line x1="371" x2="610" y1="400" y2="400" class="axisline"/><rect x="389.0" y="275.9" width="59.7" height="124.1" rx="3" fill="#e4572e"/><text x="418.8333333333333" y="267.88415854797813" text-anchor="middle" class="value">62 ms</text><rect x="460.7" y="313.9" width="59.7" height="86.1" rx="3" fill="#7a5af8"/><text x="490.5" y="305.91965834779126" text-anchor="middle" class="value">43 ms</text><rect x="532.3" y="145.8" width="59.7" height="254.2" rx="3" fill="#2e86ab"/><text x="562.1666666666667" y="137.76271186440675" text-anchor="middle" class="value">127 ms</text><text x="490.5" y="430" text-anchor="middle" class="label">16 MiB</text><line x1="646" x2="885" y1="400" y2="400" class="axisline"/><rect x="664.0" y="387.9" width="59.7" height="12.1" rx="3" fill="#e4572e"/><text x="693.8333333333334" y="379.920852826137" text-anchor="middle" class="value">105 ms</text><rect x="735.7" y="380.4" width="59.7" height="19.6" rx="3" fill="#7a5af8"/><text x="765.5" y="372.4432855280313" text-anchor="middle" class="value">170 ms</text><rect x="807.3" y="145.8" width="59.7" height="254.2" rx="3" fill="#2e86ab"/><text x="837.1666666666667" y="137.76271186440675" text-anchor="middle" class="value">2.2 s</text><text x="765.5" y="430" text-anchor="middle" class="label">128 MiB</text><line x1="921" x2="1160" y1="400" y2="400" class="axisline"/><rect x="939.0" y="145.8" width="59.7" height="254.2" rx="3" fill="#e4572e"/><text x="968.8333333333334" y="137.76271186440675" text-anchor="middle" class="value">153 ms</text><text x="1040.5" y="388" text-anchor="middle" class="na">failed</text><text x="1112.1666666666665" y="388" text-anchor="middle" class="na">not done in 2 h</text><text x="1040.5" y="430" text-anchor="middle" class="label">1 GiB</text><g transform="translate(96,472)"><rect width="18" height="18" y="-13" rx="3" fill="#e4572e"/><text x="28" y="2" class="legend">sharded object: move one half (snapshot)</text></g><g transform="translate(628,472)"><rect width="18" height="18" y="-13" rx="3" fill="#7a5af8"/><text x="28" y="2" class="legend">freeze, snapshot into two new objects</text></g><g transform="translate(96,500)"><rect width="18" height="18" y="-13" rx="3" fill="#2e86ab"/><text x="28" y="2" class="legend">v0.1: copy rows to two new objects</text></g><text x="96" y="550" class="note">The row copy keeps the busy object answering per-key fetches for minutes; the snapshot designs do not.</text>
</svg>
