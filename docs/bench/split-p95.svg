<text x="96" y="40" class="title">Write latency p95 during a split</text><text x="96" y="66" class="sub">From 1 s before the split until 1 s after it settles, background cleanup included. Each panel has its own scale.</text>
<line x1="96" x2="335" y1="400" y2="400" class="axisline"/><rect x="114.0" y="145.8" width="59.7" height="254.2" rx="3" fill="#e4572e"/><text x="143.83333333333334" y="137.76271186440678" text-anchor="middle" class="value">69 ms</text><rect x="185.7" y="245.2" width="59.7" height="154.8" rx="3" fill="#7a5af8"/><text x="215.50000000000003" y="237.24686809137805" text-anchor="middle" class="value">42 ms</text><rect x="257.3" y="201.0" width="59.7" height="199.0" rx="3" fill="#2e86ab"/><text x="287.1666666666667" y="193.0316875460575" text-anchor="middle" class="value">54 ms</text><text x="215.5" y="430" text-anchor="middle" class="label">1 MiB</text><line x1="371" x2="610" y1="400" y2="400" class="axisline"/><rect x="389.0" y="301.8" width="59.7" height="98.2" rx="3" fill="#e4572e"/><text x="418.8333333333333" y="293.7719568567026" text-anchor="middle" class="value">102 ms</text><rect x="460.7" y="288.3" width="59.7" height="111.7" rx="3" fill="#7a5af8"/><text x="490.5" y="280.28967642526965" text-anchor="middle" class="value">116 ms</text><rect x="532.3" y="145.8" width="59.7" height="254.2" rx="3" fill="#2e86ab"/><text x="562.1666666666667" y="137.76271186440675" text-anchor="middle" class="value">264 ms</text><text x="490.5" y="430" text-anchor="middle" class="label">16 MiB</text><line x1="646" x2="885" y1="400" y2="400" class="axisline"/><rect x="664.0" y="380.9" width="59.7" height="19.1" rx="3" fill="#e4572e"/><text x="693.8333333333334" y="372.87879219484404" text-anchor="middle" class="value">179 ms</text><rect x="735.7" y="395.5" width="59.7" height="4.5" rx="3" fill="#7a5af8"/><text x="765.5" y="387.5134596211366" text-anchor="middle" class="value">42 ms</text><rect x="807.3" y="145.8" width="59.7" height="254.2" rx="3" fill="#2e86ab"/><text x="837.1666666666667" y="137.76271186440675" text-anchor="middle" class="value">2.4 s</text><text x="765.5" y="430" text-anchor="middle" class="label">128 MiB</text><line x1="921" x2="1160" y1="400" y2="400" class="axisline"/><rect x="939.0" y="145.8" width="59.7" height="254.2" rx="3" fill="#e4572e"/><text x="968.8333333333334" y="137.76271186440675" text-anchor="middle" class="value">379 ms</text><text x="1040.5" y="388" text-anchor="middle" class="na">failed</text><text x="1112.1666666666665" y="388" text-anchor="middle" class="na">not done in 2 h</text><text x="1040.5" y="430" text-anchor="middle" class="label">1 GiB</text><g transform="translate(96,472)"><rect width="18" height="18" y="-13" rx="3" fill="#e4572e"/><text x="28" y="2" class="legend">sharded object: move one half (snapshot)</text></g><g transform="translate(628,472)"><rect width="18" height="18" y="-13" rx="3" fill="#7a5af8"/><text x="28" y="2" class="legend">freeze, snapshot into two new objects</text></g><g transform="translate(96,500)"><rect width="18" height="18" y="-13" rx="3" fill="#2e86ab"/><text x="28" y="2" class="legend">v0.1: copy rows to two new objects</text></g><text x="96" y="550" class="note">The row copy keeps the busy object answering per-key fetches for minutes; the snapshot designs do not.</text>
</svg>
