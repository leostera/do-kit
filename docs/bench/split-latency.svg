<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="566" viewBox="0 0 1200 566">
<style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;fill:#101828}.title{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#475467}.label{font-size:15px;font-weight:600;fill:#344054}.legend{font-size:15px}.value{font-size:14px;font-weight:600;fill:#344054}.na{font-size:13px;fill:#98a2b3}.note{font-size:13px;fill:#667085}.axisline{stroke:#344054}</style>
<rect width="1200" height="566" fill="#fff"/>
<text x="96" y="40" class="title">Slowest write during a split</text><text x="96" y="66" class="sub">Maximum write latency from 1 s before the split until 1 s after it settles. Each panel has its own scale.</text>
<line x1="96" x2="335" y1="400" y2="400" class="axisline"/><rect x="114.0" y="152.2" width="59.7" height="247.8" rx="3" fill="#e4572e"/><text x="143.83333333333334" y="144.22089869257593" text-anchor="middle" class="value">1.2 s</text><rect x="185.7" y="145.8" width="59.7" height="254.2" rx="3" fill="#7a5af8"/><text x="215.50000000000003" y="137.76271186440675" text-anchor="middle" class="value">1.2 s</text><rect x="257.3" y="333.3" width="59.7" height="66.7" rx="3" fill="#2e86ab"/><text x="287.1666666666667" y="325.2654027755852" text-anchor="middle" class="value">310 ms</text><text x="215.5" y="430" text-anchor="middle" class="label">1 MiB</text><line x1="371" x2="610" y1="400" y2="400" class="axisline"/><rect x="389.0" y="246.1" width="59.7" height="153.9" rx="3" fill="#e4572e"/><text x="418.8333333333333" y="238.12261786726415" text-anchor="middle" class="value">1.3 s</text><rect x="460.7" y="145.8" width="59.7" height="254.2" rx="3" fill="#7a5af8"/><text x="490.5" y="137.76271186440675" text-anchor="middle" class="value">2.2 s</text><rect x="532.3" y="312.9" width="59.7" height="87.1" rx="3" fill="#2e86ab"/><text x="562.1666666666667" y="304.87308043625916" text-anchor="middle" class="value">744 ms</text><text x="490.5" y="430" text-anchor="middle" class="label">16 MiB</text><line x1="646" x2="885" y1="400" y2="400" class="axisline"/><rect x="664.0" y="353.6" width="59.7" height="46.4" rx="3" fill="#e4572e"/><text x="693.8333333333334" y="345.64605313215264" text-anchor="middle" class="value">3.0 s</text><rect x="735.7" y="170.3" width="59.7" height="229.7" rx="3" fill="#7a5af8"/><text x="765.5" y="162.25717891095508" text-anchor="middle" class="value">15 s</text><rect x="807.3" y="145.8" width="59.7" height="254.2" rx="3" fill="#2e86ab"/><text x="837.1666666666667" y="137.76271186440675" text-anchor="middle" class="value">16 s</text><text x="765.5" y="430" text-anchor="middle" class="label">128 MiB</text><line x1="921" x2="1160" y1="400" y2="400" class="axisline"/><rect x="939.0" y="145.8" width="59.7" height="254.2" rx="3" fill="#e4572e"/><text x="968.8333333333334" y="137.76271186440675" text-anchor="middle" class="value">16 s</text><text x="1040.5" y="388" text-anchor="middle" class="na">failed</text><text x="1112.1666666666665" y="388" text-anchor="middle" class="na">not done in 2 h</text><text x="1040.5" y="430" text-anchor="middle" class="label">1 GiB</text><g transform="translate(96,472)"><rect width="18" height="18" y="-13" rx="3" fill="#e4572e"/><text x="28" y="2" class="legend">sharded object: move one half (snapshot)</text></g><g transform="translate(628,472)"><rect width="18" height="18" y="-13" rx="3" fill="#7a5af8"/><text x="28" y="2" class="legend">freeze, snapshot into two new objects</text></g><g transform="translate(96,500)"><rect width="18" height="18" y="-13" rx="3" fill="#2e86ab"/><text x="28" y="2" class="legend">v0.1: copy rows to two new objects</text></g><text x="96" y="550" class="note">With a snapshot, the slowest write is one that waited for the copy: with the sharded object only writes to the moving half wait.</text>
</svg>
