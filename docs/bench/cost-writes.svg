09"/><text x="28" y="2" class="legend">rows read</text></g><g transform="translate(1050,386)"><rect width="18" height="18" y="-13" fill="#7a5af8"/><text x="28" y="2" class="legend">duration</text></g><text x="96" y="446" class="note">A new key also writes the hash index: one more row written. Updates leave it alone. Each write reads its row first. Duration is a fraction of a cent either way.</text>
