<text x="96" y="40" class="title">Updates of one hot row: committed per second</text><text x="96" y="66" class="sub">A row's size goes up by one, or it is created. The read-and-put retries from a fresh read, up to 8 times. Every caller updates the same row, 10 s per point</text>
